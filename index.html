<!DOCTYPE html>
<html lang="ja">

<head>
    <meta name="google-site-verification" content="rHYmJ_IzW1SdlN13DFSFLVy_scChzGZhe9cLo259JCs" />
    <meta charset="UTF-8">
    <title>珠乃井ナナ 歌枠検索</title>
    <style>
    const searchInput = document.getElementById('searchInput');
    const resultList = document.getElementById('resultList');
    
    // 時間を秒に換算する関数
    function getSeconds(timeStr) {
        const parts = timeStr.split(':').map(Number);
        let seconds = 0;
        if (parts.length === 3) seconds = parts[0] * 3600 + parts[1] * 60 + parts[2];
        else if (parts.length === 2) seconds = parts[0] * 60 + parts[1];
        return seconds;
    }
    
    // 安全にカードを作成する関数
    function createSongCard(song) {
        const card = document.createElement('div');
        card.className = 'song-item';
    
        const title = document.createElement('div');
        title.className = 'song-title';
        title.textContent = song.title;
    
        const date = document.createElement('div');
        date.className = 'info';
        date.textContent = `配信日: ${song.date}`;
    
        const video = document.createElement('div');
        video.className = 'info';
        video.textContent = `配信名: ${song.videoTitle}`;
    
        const time = document.createElement('div');
        time.className = 'info';
        time.textContent = `歌唱時間: ${song.time}`;
    
        const link = document.createElement('a');
        link.className = 'link-btn';
        const seconds = getSeconds(song.time);
        link.href = `${song.url}&t=${seconds}s`;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = "▶ YouTubeで聴く";
    
        card.append(title, date, video, time, link);
        return card;
    }
    
    // ★新機能：ひらがなをカタカナに変換する関数
    function hiraganaToKatakana(str) {
        return str.replace(/[\u3041-\u3096]/g, function(match) {
            const chr = match.charCodeAt(0) + 0x60;
            return String.fromCharCode(chr);
        });
    }
    
    // 検索と表示の処理
    function displaySongs(filter = "") {
        resultList.innerHTML = "";
        if (typeof songData === 'undefined') return;
    
        // 入力された文字を「小文字」かつ「カタカナ」に統一する
        const searchWord = hiraganaToKatakana(filter.toLowerCase());
    
        const filtered = songData.filter(item => {
            // 対象のテキストもすべて「カタカナ」に変換して比較する
            const titleKana = hiraganaToKatakana(item.title.toLowerCase());
            const videoTitleKana = hiraganaToKatakana(item.videoTitle.toLowerCase());
            const keywordsKana = item.keywords ? hiraganaToKatakana(item.keywords.toLowerCase()) : "";
            
            // カタカナ同士、英小文字同士で比較するので、ひらがな/カタカナの揺れが無視される
            return titleKana.includes(searchWord) || 
                   videoTitleKana.includes(searchWord) ||
                   keywordsKana.includes(searchWord);
        });
    
        if (filtered.length === 0) {
            const noResult = document.createElement('p');
            noResult.textContent = "該当する曲が見つかりません。";
            noResult.style.textAlign = "center";
            noResult.style.color = "#888";
            resultList.appendChild(noResult);
            return;
        }
    
        filtered.forEach(song => {
            resultList.appendChild(createSongCard(song));
        });
    }
    
    searchInput.addEventListener('input', (e) => displaySongs(e.target.value));
    displaySongs();
    </script>
</body>

</html>
